description: Unauthorized error
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          description: Status code
          example: 401
        message:
          type: string
          description: Error message
          example: Unauthorized error
        data:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              example: 'Access token expired'
