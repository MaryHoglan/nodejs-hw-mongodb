tags:
  - Auth
summary: Send password reset email
operationId: sendResetEmail
description: 
  Sends an email to the user with a link containing a token to reset their password.
  The user must provide a valid email registered in the system.
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: User's registered email address
            type: string
            example: user@example.com
responses:
  '200':
    description: Reset password email sent successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Message sent successfully .
            data:
              type: object
  '400':
    $ref: ../../components/responses/400.yaml
  '404':
    description: User not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: User not found
  '500':
    $ref: '../../components/responses/500.yaml'
