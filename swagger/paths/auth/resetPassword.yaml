tags:
  - Auth
summary: Reset user password
operationId: resetPassword
description: 
  Resets a user's password using a JWT token sent via email. The token verifies
  the password reset request. The new password must meet security requirements.
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            description: JWT token received in the reset password email link
            type: string
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          password:
            description: User's new password
            type: string
            example: NewStrongPassword123!
responses:
  '200':
    description: Password reset successful
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
            data:
              type: object
  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    description: Unauthorized - token expired or invalid
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Token is expired or invalid.
  '404':
    description: User not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: User not found
  '500':
    $ref: '../../components/responses/500.yaml'
