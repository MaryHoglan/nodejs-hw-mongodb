tags:
  - Auth
summary: User login endpoint
operationId: loginUser
description: 'Authenticate user and initiate a session by providing email and password.'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: 'The email address associated with the user account.'
            type: string
            example: user@example.com
          password:
            description: 'The password for the user account.'
            type: string
            example: 'MySecurePass#2025'
responses:
  '200':
    description: Successful user login, returns access token and sets session cookies.
    headers:
      Set-Cookie:
        description: Cookies set after successful login
        schema:
          type: array
          items:
            type: string
            example: |
              sessionId=def456; Path=/; HttpOnly
              refreshToken=uvw789; Path=/; HttpOnly
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: User login successfully!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'AbCdEfGhIjKlMnOpQrStUvWxYz1234567890'
  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
